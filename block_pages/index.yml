blocks:
  - type: hero
    title: CoruñaWTF
  - type: text
    title: Bienvenido a Coruña Web Talks and Friends
    id: about
    theme: is-dark width-box box-fill
    columns: false
    text: "CoruñaWTF somos una comunidad de personas de A Coruña y alrededores, que se reúnen para compartir, aprender y disfrutar alrededor del desarrollo y diseño web. \r\n\r\nNuestro propósito es aprender juntos, intercambiar ideas, conectar con otras personas apasionadas por la web y, sobre todo, divertirnos en el camino.\r\n\r\nOrganizamos eventos mensuales para descubrir nuevas tecnologías o conceptos relacionados con la web y pasar un buen rato juntos. Si te interesa la web, ¡apúntate al próximo evento!"
  - type: separator
    width: is-full
  - type: calendar
    title: Nuestros eventos
    id: events
    days:
      - title: Temporada 4
        events:
          - time: Mayo
            title: 'Weave.js'
            subtitle: Crear un editor visual colaborativo no debería ser tan difícil
            description: >-
              Cómo construir un editor visual colaborativo en tiempo real
              sin que el proceso se convierta en una pesadilla técnica.
            speakers:
              - jesus-pineiro
          - time: Abril
            title: 'Ver sin ver'
            subtitle: Accesibilidad, lectores de pantalla e IA
            description: >-
              Segunda charla de accesibilidad en colaboración con GDG A
              Coruña, esta vez centrada en el papel de la IA en los
              lectores de pantalla.
            speakers:
              - carlos-garrido
          - time: Marzo
            title: Brainstorming / Meet & Greet
            description: >-
              Nos reunimos para pensar entre todos las temáticas y charlas
              de la siguiente temporada de CoruñaWTF.
            speakers: []
          - time: Febrero
            title: 'A11y en la práctica'
            subtitle: Lo que tu lector de pantalla sabe de tu web (y tú no)
            description: >-
              Charla en colaboración con GDG A Coruña sobre accesibilidad
              real: qué información recibe un lector de pantalla de tu web
              y qué se nos suele escapar.
            speakers:
              - carlos-garrido
          - time: Enero
            title: Module Federation y la Infraestructura de Superposición
            description: >-
              Cómo Module Federation permite componer aplicaciones frontend
              distribuidas sin sacrificar independencia entre equipos.
            speakers:
              - nestor-lopez
          - time: Noviembre
            title: 'Del Saas al Yo-aaS'
            subtitle: Self-hosting para recuperar la autonomía digital
            description: >-
              Todos los secretos para recuperar la autonomía digital
              montando tu propio servidor de servicios.
            speakers:
              - ignacio-esposito
          - time: Octubre
            title: 'Unha pinga de Erlang/Elixir para salvar a Eustaquia'
            description: >-
              Introducción a Erlang/Elixir a través de una historia práctica
              sobre concurrencia y tolerancia a fallos.
            speakers:
              - icia-carro
          - time: Septiembre
            title: 'Cómo llevarse bien con un diseñador'
            subtitle: Un vistazo a los fundamentos del diseño gráfico
            description: >-
              Los fundamentos del diseño gráfico explicados para que
              programadores y diseñadores se entiendan mejor en el día a día.
            speakers:
              - yago-concejo
      - title: Temporada 3
        events:
          - time: Junio
            title: '"Last round: conversaciones en comunidad"'
            description: >-
              Cierre de temporada en colaboración con otras comunidades tech
              de A Coruña: Python Coruña, GPUL, GDG Coruña, SysArmy Galicia,
              WordPress Coruña, CoruñaJUG, Bricolabs y más.
            speakers: []
          - time: Junio
            title: Un framework para que tu side project no se quede en side...
            subtitle: sino que se convierta en project
            description: >-
              Cómo dar el salto de side project a proyecto real sin que se
              quede a medias en el camino.
            speakers:
              - david-bonilla
          - time: Mayo
            title: 'Javascript Inside: '
            subtitle: Meet the people behind the spec
            description: >-
              Evento especial en colaboración con Igalia y Kelea: varios
              miembros del comité TC39 comparten su visión sobre el presente
              y el futuro de JavaScript.
            speakers: []
          - time: Mayo
            title: Cómo prepararte para brillar en entrevistas tech
            description: >-
              Consejos prácticos para preparar tu CV, tu perfil de LinkedIn,
              las entrevistas técnicas y la negociación de la oferta final.
            speakers:
              - ilda-neta
          - time: Abril
            title: 'Tyrian: '
            subtitle: Navegando entre SPAs y juegos indie con Scala.js
            description: >-
              Tyrian, inspirado en Elm y hecho para Scala.js, une desarrollo
              funcional y flexibilidad para SPAs y videojuegos indie.
            speakers:
              - david-gil
          - time: Marzo
            title: Brainstorming / Meet & Greet
            description: >-
              Nos reunimos para pensar entre todos las temáticas y charlas
              de la siguiente temporada de CoruñaWTF.
            speakers: []
          - time: Febrero
            title: From Code to Cloud
            subtitle: "A Beginner's Journey with Docker and Railway"
            description: >-
              Aprende a usar Docker y Railway para crear y desplegar apps.
              Ideal para principiantes que quieren llevar su código a la nube.
            speakers:
              - roberto-garcia
          - time: Enero
            title: Programando la resistencia
            subtitle: Tecnologías web para empoderar el activismo
            description: >-
              Descubre cómo el código puede empoderar movimientos sociales,
              proteger activistas y promover la soberanía digital.
            speakers:
              - carol-gonzalez
          - time: Diciembre
            title: Service Oriented Architecture con tRPC
            description: >-
              Descubre cómo cómo la librería tRPC hace más sencillo y eficiente
              trabajar con servicios en la web
            speakers:
              - nestor-lopez
          - time: Noviembre
            title: Diseño Suizo
            subtitle: Funcionalidad y Estética en la Web Moderna
            description: >-
              Descubre cómo el diseño suizo mejora la estética y funcionalidad
              en la web moderna.
            speakers:
              - alex-brea
          - time: Octubre
            title: 'Vue en Acción: '
            subtitle: Crea Interfaces Web Dinámicas
            description: >-
              Aprende a crear aplicaciones web dinámicas con Vue, usando la
              Composition API, su sistema de reactividad y un ejemplo práctico
              en tiempo rea
            speakers:
              - alan-luna
          - time: Septiembre
            title: 'PROTOBUF Y gRPC. '
            subtitle: Introducción a schema-driven development
            description: >-
              gRPC, protobuf y schema-driven development para crear productos
              distribuidos, multilenguaje sin hand-written boilerplate
            speakers:
              - santi-jimenez
      - title: Temporada 2
        events:
          - time: Junio
            title: 'Effect: TypeScript para producción'
            description: La biblioteca estándar que falta para TypeScript
            speakers:
              - nestor-lopez
          - time: Mayo
            title: Unboxing Penpot 2.0
            description: "Cómo esta herramienta de diseño colaborativo está cambiando la forma de hacer interfaces\r\n\r\n"
            speakers:
              - eva-marco
          - time: Abril
            title: 'Diseño Ético en la Era Digital: '
            subtitle: ¿Qué Estamos Creando?
            speakers:
              - alex-brea
          - time: Marzo
            title: Introducción a liveview native
            speakers:
              - miguel-camba
          - time: Febrero
            title: Cómo hacer un buen diseño de UI
            description: >-
              Veremos qué hacer y qué no para que no te sangren los ojos al ver
              una interfaz web
            speakers:
              - iria-hidalgo
          - time: Enero
            title: Cómo triunfar en IT siendo mediocre
            subtitle: Open space
            description: >-
              Open space en el que indagaremos sobre como triunfar en el sector
              IT sin ser excepcional.
            speakers:
              - alberto-bardanca
          - time: Noviembre
            title: 'Notion 101:'
            subtitle: ' Desbloquea tu productividad'
            description: >-
              Cómo sacar el máximo provecho de Notion y el potencial de usar su
              API y sus automatizaciones
            speakers:
              - alvaro-lozano
          - time: Octubre
            title: Self-hosting de servicios
            description: >-
              Todos los secretos para montar tu propio servidor, sin usar AWS o
              Azure
            speakers:
              - miguel-camba
          - time: Septiembre
            title: Elixir & Phoenix 101
            description: >-
              Introducción sobre Elixir, un lenguaje basado en Erlang y su
              framework para desarrollo web, Phoenix.
            speakers:
              - carla-rodriguez
      - title: Temporada 1
        events:
          - time: Junio
            title: Los devs de la mesa cuadrada
            subtitle: Buenas prácticas de desarrollo y met. ágiles
            description: "Mesa redonda sobre buenas prácticas de desarrollo y metodologías ágiles\r\n\r\n"
            speakers:
              - pablo-castro
              - pablo-cancelo
              - yisus
              - martin-torre
          - time: Mayo
            title: Anatomía de webs perfectas desde el punto de vista SEO
            description: >-
              Errores que han cometido algunas empresas y como estos han
              afectado a su posicionamiento web
            speakers:
              - sergio-castelo
          - time: Abril
            title: Microfrontends en monorepo
            description: Cómo crear y gestionar microfrontends en un solo repositorio
            speakers:
              - carlos-cortizas
          - time: Marzo
            title: 'Diseño y desarrollo. '
            subtitle: De 0 a unicornio
            description: >-
              Charla introductoria sobre UX, roles y proceso de diseño. Aprende
              a implementar un sistema de diseño y descubre recursos útiles
            speakers:
              - andrea
          - time: Febrero
            title: Horror Stories
            description: >-
              Reunión informal para contar nuestras liadas y experiencias
              "horribles"
            speakers: []
          - time: Enero
            title: El Origen
            description: >-
              Open space para definirnos y conocernos. Tienes ganas de charlas,
              talleres, ... es el momento y lugar de pedirlos
            speakers:
              - andrea
              - yisus
